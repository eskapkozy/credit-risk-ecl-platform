

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mlflow_user
      POSTGRES_PASSWORD: mlflow_eskap
      POSTGRES_DB: mlflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    command: >
      bash -c "mkdir -p /mlflow/artifacts &&
      chmod -R 777 /mlflow &&
      pip install psycopg2-binary &&
      mlflow server
      --backend-store-uri postgresql://mlflow_user:mlflow_eskap@postgres:5432/mlflow
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --allowed-hosts api,nginx,mlflow,mlflow:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    user: root
    networks:
      - platform-net

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - platform-net

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_CONFIG_PATH=/app/configs/mlflow_config.yaml
      - MODEL_CONFIG_PATH=/app/configs/model_config.yaml
    depends_on:
      - mlflow
    networks:
      - platform-net


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - api
    networks:
      - platform-net

volumes:
  postgres_data:
  mlflow_artifacts:

networks:
  platform-net:
    driver: bridge